name: Release

# ★ 打 tag 即发布：
#     git tag v1.7.0 && git push origin master v1.7.0
#   → 跑离线回归 → 构建自包含单文件 exe → 核对版本 → 建 Release 上传 exe。
#   目标机器只要 Windows x64，**不需要装 .NET 运行时**。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v1.7.0）'
        required: true

permissions:
  contents: write          # 创建 Release + 上传附件需要

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── 1. 回归不过就不发版 ──
      - name: C# 离线回归（281 项）
        shell: pwsh
        run: |
          dotnet restore xqd-csharp/Xqd.sln --configfile .github/nuget.ci.config
          dotnet build xqd-csharp/Xqd.sln -c Release --no-restore
          ./xqd-csharp/src/Xqd.Tests/bin/Release/net8.0/Xqd.Tests.exe

      # ── 2. 按标签版本号发布单文件 exe ──
      - name: 发布自包含单文件 exe
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          if (-not $ver) { throw "拿不到版本号（TAG=$env:TAG）" }
          Write-Host ">>> 发布版本: $ver"

          # 提醒：csproj 里的默认 PkgVersion 应与之同步（界面版本读程序集版本）
          $csproj = Get-Content xqd-avalonia/src/Xqd.Avalonia/Xqd.Avalonia.csproj -Raw
          if ($csproj -match '<PkgVersion[^>]*>([^<]+)<') {
            $default = $Matches[1]
            if ($default -ne $ver) { Write-Warning "csproj 默认 PkgVersion=$default 与标签 $ver 不一致（本次发布仍按标签）" }
          }

          dotnet restore xqd-avalonia/src/Xqd.Avalonia/Xqd.Avalonia.csproj --configfile .github/nuget.ci.config -r win-x64
          dotnet publish xqd-avalonia/src/Xqd.Avalonia/Xqd.Avalonia.csproj -c Release --no-restore -o xqd-avalonia/dist -p:PkgVersion=$ver
          Get-ChildItem xqd-avalonia/dist | Format-Table Name, Length

      # ── 3. 核对产物：文件名 + 文件版本都要跟标签一致 ──
      - name: 核对产物版本
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          $exe = "xqd-avalonia/dist/xqd-downloader-v$ver.exe"
          if (-not (Test-Path $exe)) { throw "产物不对：$exe 不存在" }
          $fv = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host ">>> 产物: $exe   FileVersion=$fv"
          if (-not $fv.StartsWith($ver)) { throw "文件版本($fv) 与标签($ver) 不一致" }
          $len = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host ">>> 自包含单文件，大小 ${len} MB"

      # ── 4. 建 Release、传附件 ──
      - name: 创建 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 兴趣岛视频下载器 ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            xqd-avalonia/dist/xqd-downloader-v*.exe
