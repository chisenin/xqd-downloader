name: CI

# ★ 每次 push / PR 跑一遍：C# 离线回归 + 单文件发行版能否构建。
#   回归全是离线的（不发网络请求、不碰真实账号），几秒到几十秒出结果。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: 离线回归 + 发行版构建
    runs-on: windows-latest
    env:
      # Windows runner 的 stdout 是管道，Python 默认取 ANSI 代码页，
      # 打印中文会 UnicodeEncodeError —— 统一开 UTF-8。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原（Core / Tests / Cli / Server）
        shell: pwsh
        run: dotnet restore xqd-csharp/Xqd.sln --configfile .github/nuget.ci.config

      - name: C# 离线回归（281 项：签名链 / 命名 / 去重 / 视图过滤 / Ui 组件）
        shell: pwsh
        run: |
          dotnet build xqd-csharp/Xqd.sln -c Release --no-restore
          ./xqd-csharp/src/Xqd.Tests/bin/Release/net8.0/Xqd.Tests.exe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 核心库语法检查（只验编译，不跑回归）
        shell: pwsh
        run: |
          python -m compileall -q xqd
          python -c "import xqd; print('xqd', xqd.__version__)"

      - name: 单文件自包含发行版能构建
        shell: pwsh
        run: |
          dotnet restore xqd-avalonia/src/Xqd.Avalonia/Xqd.Avalonia.csproj --configfile .github/nuget.ci.config -r win-x64
          dotnet publish xqd-avalonia/src/Xqd.Avalonia/Xqd.Avalonia.csproj -c Release --no-restore -o xqd-avalonia/dist -p:PkgVersion=0.0.0-ci -p:DebugType=None
          $exe = "xqd-avalonia/dist/xqd-downloader-v0.0.0-ci.exe"
          if (-not (Test-Path $exe)) { throw "没产出单文件 exe：$exe" }
          $len = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host ">>> $exe  ${len} MB"
